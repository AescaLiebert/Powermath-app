<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>{{{ PRODUCT_NAME }}}</title>
    <meta name="theme-color" content="{{{ SPLASH_SCREEN_STYLE.toLowerCase() === 'light' ? '#fff' : '#000' }}}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="{{{ PRODUCT_NAME }}}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{{ PRODUCT_NAME }}}">
    <meta property="og:description" content="Play {{{ PRODUCT_NAME }}} in your browser.">
    <meta property="og:image" content="TemplateData/icons/mathworld-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{{ PRODUCT_NAME }}}">
    <meta name="twitter:description" content="Play {{{ PRODUCT_NAME }}} in your browser.">
    <meta name="twitter:image" content="TemplateData/icons/mathworld-512.png">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="icon" type="image/x-icon" href="TemplateData/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="TemplateData/icons/mathworld-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="TemplateData/icons/mathworld-512.png">
    <link rel="apple-touch-icon" href="TemplateData/icons/mathworld-180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="TemplateData/icons/mathworld-180.png">
    <link rel="apple-touch-icon-precomposed" href="TemplateData/icons/mathworld-180.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <script defer src="TemplateData/pwa-install.js"></script>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
  <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <aside id="pwa-install-prompt" class="pwa-install-prompt" hidden aria-labelledby="pwa-install-title">
      <img class="pwa-install-icon" src="TemplateData/icons/mathworld-192.png" alt="">
      <div class="pwa-install-copy">
        <strong id="pwa-install-title">Install this app</strong>
        <span>Add PowerMath to your Android home screen for faster access.</span>
      </div>
      <button id="pwa-install-button" class="pwa-install-action" type="button">Install</button>
      <button id="pwa-install-dismiss" class="pwa-install-dismiss" type="button" aria-label="Not now">&times;</button>
    </aside>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty" role="progressbar" aria-label="Loading game data" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-text" role="status" aria-live="polite">Loading 0%</div>
      </div>
      <div id="unity-warning"> </div>
#if SHOW_DIAGNOSTICS
    <div id="unity-footer">
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
    </div>
#endif
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingText = document.querySelector("#unity-loading-text");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var contentBaseUrl = "https://pub-1de297cf85f444a7b4ca56dd0fc5d4e5.r2.dev";
      var buildUrl = contentBaseUrl + "/Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: contentBaseUrl + "/StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        // Cap mobile devicePixelRatio to prevent massive 2732x2048 framebuffers on Retina iPads
        // which exhaust WebKit GPU / Jetsam memory limits and crash WKWebView.
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.3);
      }

#if SHOW_DIAGNOSTICS
        // position the diagnostics icon in the corner on the canvas
        let diagnostics_icon = document.getElementById("diagnostics-icon");
        diagnostics_icon.style.position = "fixed";
        diagnostics_icon.style.bottom = "10px";
        diagnostics_icon.style.right = "0px";
        canvas.after(diagnostics_icon);
#endif

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percent = Math.round(100 * progress);
          progressBarFull.style.width = percent + "%";
          progressBarEmpty.setAttribute("aria-valuenow", percent);
          loadingText.textContent = "Loading " + percent + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";
          var resumeAudio = function () {
            try {
              var ctx = (typeof Module !== 'undefined' && Module.WEBAudio && Module.WEBAudio.audioContext) ||
                        (typeof WEBAudio !== 'undefined' && WEBAudio.audioContext) ||
                        window.unityAudioContext;
              if (ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') {
                ctx.resume();
              }
            } catch (e) {}
          };
          ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(function (evt) {
            window.addEventListener(evt, resumeAudio, { capture: true, passive: true });
          });
#if SHOW_DIAGNOSTICS
          document.getElementById("diagnostics-icon").onclick = () => {
              unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
          };
#endif
#if DEVELOPMENT_PLAYER
          var profile = unityProfiler.createButton(unityInstance);
          profile.style.position = 'fixed';
          profile.style.bottom = '5px';
          profile.style.left = '5px';
          document.body.appendChild(profile);
#endif
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
