<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 16px;
      font: 12px Inter, sans-serif;
      color: #202124;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      margin: 8px 0;
      padding: 8px;
    }

    button {
      width: 100%;
      padding: 8px;
    }

    #status {
      margin-top: 12px;
      color: #667085;
    }
  </style>
</head>

<body>
  <strong>PowerMath AI Bridge</strong>

  <input id="token" type="password" placeholder="Local bridge token">

  <button id="connect">Connect</button>
  <div id="status">Disconnected</div>

  <script>
    const endpoint = "http://localhost:3847";
    const status = document.querySelector("#status");

    let token = "";
    let running = false;
    let executing = false;

    document.querySelector("#connect").onclick = async () => {
      token = document.querySelector("#token").value.trim();

      if (!token) {
        status.textContent = "Enter the bridge token.";
        return;
      }

      try {
        const response = await request("/health");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        running = true;
        status.textContent = "Connected — waiting for jobs";
        poll();
      } catch (error) {
        status.textContent = `Connection error: ${error.message}`;
      }
    };

    async function request(path, options = {}) {
      return fetch(endpoint + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
          ...(options.headers ?? {})
        }
      });
    }

    async function poll() {
      while (running) {
        if (executing) {
          await new Promise(resolve => setTimeout(resolve, 200));
          continue;
        }

        try {
          const response = await request("/jobs/next");
          const job = await response.json();

          if (job) {
            executing = true;
            status.textContent = `Running ${job.command.type}`;
            parent.postMessage(
              { pluginMessage: { type: "execute-job", job } },
              "*"
            );
          }
        } catch (error) {
          status.textContent = `Connection error: ${error.message}`;
        }

        await new Promise(resolve => setTimeout(resolve, 500));
      }
    }

    window.onmessage = async event => {
      const message = event.data.pluginMessage;

      if (!message || message.type !== "job-result") {
        return;
      }

      await request(`/jobs/${message.id}/result`, {
        method: "POST",
        body: JSON.stringify(message.result)
      });

      status.textContent = message.result.ok
        ? "Connected — waiting for jobs"
        : `Failed: ${message.result.error}`;
      executing = false;
    };
  </script>
</body>

</html>
